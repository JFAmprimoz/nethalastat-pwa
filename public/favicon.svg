<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 512 512"
   width="100%"
   height="100%"
   version="1.1"
   id="svg15"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs2">
    <!-- 
      This mask creates a perfect, scalable visual gap where the elements cross.
      White preserves the sword, black erases a local channel centered at (256, 256).
      Using a 90-degree rotation inside the mask perfectly counteracts the sword's -45 degree hilt rotation,
      aligning the cutout at exactly 45 degrees to match the pen.
      
      FIXED: Swapped width to 28px (matching the 24px pen + 2px gaps) 
             and height to 36px (fully clearing the 28px sword blade width).
    -->
    <mask
       id="pen-knockout">
      <rect
         x="0"
         y="0"
         width="512"
         height="512"
         fill="#ffffff"
         id="rect1" />
      <g
         transform="rotate(90 256 256)"
         id="g2">
        <rect
           x="242"
           y="238"
           width="28"
           height="36"
           rx="2"
           fill="#000000"
           id="rect2" />
      </g>
    </mask>
  </defs>
  <!-- ================= BACKGROUND ROUNDEL ================= -->
  <!-- Rich dark charcoal backdrop -->
  <circle
     cx="256"
     cy="256"
     r="230"
     fill="#0f0f11"
     id="circle2" />
  <!-- ================= TRANSLATION WRAPPER ================= -->
  <!-- 
    Shifts the entire crossed asset down by 15px to offset the visual weight 
    imbalance caused by the elongated tips, aligning it perfectly to the eye.
  -->
  <g
     transform="translate(0, 15)"
     id="g15">
    <!-- ================= SWORD (Bottom-Left to Top-Right) ================= -->
    <!-- Mask is applied here to slice out the crossover gap automatically -->
    <g
       transform="rotate(-45 256 256)"
       mask="url(#pen-knockout)"
       id="g7">
      <!-- Solid Bold Blade (Flat white for maximum contrast) -->
      <polygon
         points="256,50 242,80 242,315 270,315 270,80"
         fill="#ffffff"
         id="polygon2" />
      <!-- Flat Minimal Shadow Side -->
      <polygon
         points="256,50 256,315 270,315 270,80"
         fill="#cbd5e1"
         id="polygon3" />
      <!-- Simplified Flat Gold Crossguard -->
      <rect
         x="196"
         y="315"
         width="120"
         height="14"
         rx="3"
         fill="#fbbf24"
         id="rect3" />
      <!-- Sleek Minimal Grip -->
      <rect
         x="246"
         y="329"
         width="20"
         height="66"
         rx="2"
         fill="#334155"
         id="rect4" />
      <rect
         x="246"
         y="342"
         width="20"
         height="5"
         fill="#fbbf24"
         id="rect5" />
      <rect
         x="246"
         y="358"
         width="20"
         height="5"
         fill="#fbbf24"
         id="rect6" />
      <rect
         x="246"
         y="374"
         width="20"
         height="5"
         fill="#fbbf24"
         id="rect7" />
      <!-- Solid Gold Pommel -->
      <circle
         cx="256"
         cy="405"
         r="14"
         fill="#fbbf24"
         id="circle7" />
    </g>
    <!-- ================= PEN (Bottom-Right to Top-Left) ================= -->
    <!-- Drawn perfectly on top of the mask cutout gap -->
    <g
       transform="rotate(45 256 256)"
       id="g14">
      <!-- 1. Solid Blue Plastic Pen Barrel -->
      <rect
         x="244"
         y="115"
         width="24"
         height="255"
         rx="2"
         fill="#2563eb"
         id="rect8" />
      <rect
         x="256"
         y="115"
         width="12"
         height="255"
         fill="#3b82f6"
         id="rect9" />
      <!-- 2. Clean Silver Nose Cone -->
      <polygon
         points="244,115 248,80 264,80 268,115"
         fill="#94a3b8"
         id="polygon9" />
      <polygon
         points="256,115 256,80 264,80 268,115"
         fill="#cbd5e1"
         id="polygon10" />
      <!-- 3. Bold Gold Ballpoint Tip -->
      <polygon
         points="249,80 256,54 263,80"
         fill="#f59e0b"
         id="polygon11" />
      <circle
         cx="256"
         cy="53"
         r="2.5"
         fill="#1e293b"
         id="circle11" />
      <!-- 4. Chrome Cap Ring -->
      <rect
         x="246"
         y="370"
         width="20"
         height="15"
         fill="#cbd5e1"
         id="rect11" />
      <rect
         x="246"
         y="370"
         width="10"
         height="15"
         fill="#94a3b8"
         id="rect12" />
      <!-- 5. Click Plunger -->
      <rect
         x="248"
         y="385"
         width="16"
         height="15"
         rx="1"
         fill="#2563eb"
         id="rect13" />
      <rect
         x="248"
         y="385"
         width="8"
         height="15"
         fill="#3b82f6"
         id="rect14" />
    </g>
  </g>
</svg>
